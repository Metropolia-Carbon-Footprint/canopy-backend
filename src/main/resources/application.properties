spring.application.name=canopy-backend

# Load local development values from the project-root .env file when present.
# The file is optional so shared environments can provide configuration externally.
spring.config.import=optional:file:./.env[.properties]

# Datasource Configuration for PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA & Flyway Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Local security
security.jwt.issuer=canopy-backend
security.jwt.access-ttl=15m
security.refresh-token.ttl=30d
# Optional stable JWT signing secret for shared environments
# When omitted, a temporary random signing key is generated at startup,
# intentionally invalidating existing tokens after a backend restart.
# Configure externally when needed:
#security.jwt.secret=${SECURITY_JWT_SECRET}
